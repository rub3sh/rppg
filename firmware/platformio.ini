[env:seeed_xiao_esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = colorize, time

lib_deps =
    knolleary/PubSubClient @ ^2.8

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Waveform batches are ~350 bytes; the library default is 256.
    -DMQTT_MAX_PACKET_SIZE=1024
    -DMQTT_KEEPALIVE=15

; Sensor and serial only — no radio. Flash this when the board reboots on its
; own: if the reboots stop, the supply cannot carry the WiFi current spike.
[env:bringup]
extends = env:seeed_xiao_esp32c3
build_flags = ${env:seeed_xiao_esp32c3.build_flags} -DBRINGUP_NO_WIFI

; Twenty-line radio-only sketch (tools/wifi_min.cpp). Flash this to decide
; whether a brownout is caused by this project's firmware or by the board's
; power supply — it does nothing but start the radio.
[env:wifimin]
extends = env:seeed_xiao_esp32c3
build_src_filter = -<*> +<../tools/wifi_min.cpp>
