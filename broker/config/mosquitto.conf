# Mosquitto 2.x refuses to listen at all without an explicit listener, and
# defaults to denying anonymous clients. Both are spelled out here.
listener 1883
allow_anonymous true

# Retained status messages must survive a broker restart, otherwise a dashboard
# opened after a reboot shows no device until the next keepalive.
persistence true
persistence_location /mosquitto/data/

# Docker collects stdout; a file log would just rot inside the volume.
log_dest stdout
log_type error
log_type warning
log_type notice

# The waveform topic is small but frequent (4 msg/s); keep the queue shallow so a
# slow subscriber drops stale waveform rather than accumulating a backlog.
max_queued_messages 200
