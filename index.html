<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rPPG</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0e1116;color:#e6edf3;
            font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:16px;padding:24px;text-align:center}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
  p.sub{margin:0;color:#8b98a5;font-size:13px;max-width:420px}
  .cards{display:grid;gap:14px;width:100%;max-width:560px;margin-top:8px}
  @media(min-width:600px){.cards{grid-template-columns:1fr 1fr}}
  a.card{display:block;padding:22px 18px;border-radius:14px;text-decoration:none;
         border:1px solid #262d36;background:#161b22;color:#e6edf3;transition:.15s}
  a.card:hover{border-color:#3d4753;background:#1b222b}
  a.card .ico{font-size:34px;line-height:1}
  a.card b{display:block;margin:10px 0 4px;font-size:17px}
  a.card span{color:#8b98a5;font-size:12.5px;display:block}
</style>

<h1>Contactless Heart-Rate Monitor</h1>
<p class="sub">Remote photoplethysmography. Open the capture page on the phone,
the monitor on the laptop &mdash; they share one session.</p>

<div class="cards">
  <a class="card" href="/mobile">
    <div class="ico">&#128241;</div>
    <b>Mobile &mdash; Capture</b>
    <span>Camera, screen light control, streams to the monitor</span>
  </a>
  <a class="card" href="/pc">
    <div class="ico">&#128187;</div>
    <b>PC &mdash; Monitor</b>
    <span>Live stream, heart rate, charts, accuracy check</span>
  </a>
</div>
